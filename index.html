<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>병원별 유튜브 실시간 모니터링 관제센터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; background: #0F172A; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
    .box { background: #1E293B; padding: 40px 44px; border-radius: 24px; text-align: center; max-width: 580px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { font-size: 22px; margin-bottom: 6px; font-weight: 800; letter-spacing: -0.5px; }
    p { color: #94A3B8; font-size: 13px; margin-bottom: 28px; }
    .btn-wrap { display: flex; flex-direction: column; gap: 14px; }
    a { display: block; padding: 18px 24px; border-radius: 16px; color: white; text-decoration: none; text-align: left; transition: transform 0.15s ease, filter 0.15s ease; }
    a:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn-secret { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 4px 14px rgba(5,150,105,0.3); }
    .btn-oho { background: linear-gradient(135deg, #2563EB, #1D4ED8); box-shadow: 0 4px 14px rgba(37,99,235,0.3); }
    .footer-note { margin-top: 26px; font-size: 12px; color: #64748B; }
  </style>
</head>
<body>
<div class="box">
  <h1>🏥 병원별 유튜브 실시간 모니터링 관제센터</h1>
  <p>24시간 상시 가동 · 30일 보장 완주 내역 실시간 확인</p>
  <div class="btn-wrap">
    <a href="secret/" class="btn-secret">
      <div style="font-size: 18px; font-weight: 800;">🏥 시크릿성형외과 관제센터</div>
      <div style="font-size: 13px; opacity: 0.9; margin-top: 4px;">앞트임복원 송승욱 · 앞트임복원 시크릿 (30일 완주) →</div>
    </a>
    <a href="oho/" class="btn-oho">
      <div style="font-size: 18px; font-weight: 800;">🏥 오호성형외과 관제센터</div>
      <div style="font-size: 13px; opacity: 0.9; margin-top: 4px;">상안검 · 하안검 오호성형외과 (9월 30일 완주) →</div>
    </a>
  </div>
  <div class="footer-note">⚡ 365일 24시간 무중단 클라우드 상시 가동 시스템</div>
</div>
</body>
</html>
